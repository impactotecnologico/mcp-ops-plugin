name: Supply chain policy
on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supply-chain:
    name: Supply chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Install integrity-locked public CI tools
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --prefix .github/supply-chain-tools
      - name: Validate supply chain policy and negative cases
        run: |
          node scripts/supply-chain/check.mjs
          node --test scripts/supply-chain/supply-chain.test.mjs
          node --test scripts/supply-chain/sign-release.test.mjs
          node scripts/supply-chain/inventory.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-inventory-${{ github.sha }}-${{ github.run_attempt }}
          path: build-evidence/
          if-no-files-found: error
          retention-days: 30
