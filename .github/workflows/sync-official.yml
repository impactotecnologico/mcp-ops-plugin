name: Sync Official Repository

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          git remote add official https://x-access-token:${{ secrets.OFFICIAL_REPO_TOKEN }}@github.com/opsphere-io/opsphere-plugin.git
          git push official main --force