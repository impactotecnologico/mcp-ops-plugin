name: CI

# Public hygiene checks for marketplace bundle (flags #5–6):
# - scripts/ci-validate.sh — manifests, no secrets/hooks/exfiltration patterns
# - Gitleaks — full git history secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manifests and public-repo hygiene
        run: npm test

      # gitleaks/gitleaks-action@v2 requires GITLEAKS_LICENSE on org-owned repos
      # (opsphere-io). The MIT gitleaks CLI has the same detection rules.
      - name: Gitleaks (full history)
        run: |
          GITLEAKS_VERSION=8.24.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --verbose
